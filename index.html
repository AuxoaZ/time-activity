<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Activity</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2128; --muted:#6b7480; --track:#e6e9ee; --accent:#2f6fed; --ok:#1f9d55; --border:#e1e4e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151a; --card:#1b1f26; --text:#e6e9ee; --muted:#8b95a3; --track:#2a303a; --accent:#5b8cff; --ok:#3ecf7a; --border:#2a303a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,Segoe UI,sans-serif; }
  main { max-width:880px; margin:0 auto; padding:24px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  h1 { font-size:22px; margin:0; }
  .muted { color:var(--muted); font-size:13px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin:20px 0; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .card h2 { margin:0 0 4px; font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .big { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; }
  .big small { font-size:14px; font-weight:400; color:var(--muted); }
  .bar { height:10px; background:var(--track); border-radius:99px; overflow:hidden; margin:10px 0 6px; }
  .bar > i { display:block; height:100%; background:var(--accent); border-radius:99px; }
  .bar.done > i { background:var(--ok); }
  .settings { display:flex; gap:16px; flex-wrap:wrap; align-items:end; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:20px; }
  label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:4px; }
  input { width:110px; padding:6px 8px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  .chart { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .chart h2 { margin:0 0 12px; font-size:15px; }
  .row { display:grid; grid-template-columns:84px 1fr 64px; gap:10px; align-items:center; margin:5px 0; font-size:13px; font-variant-numeric:tabular-nums; }
  .row .bar { margin:0; height:14px; border-radius:4px; }
  .row .bar > i { border-radius:4px; }
  .row.today .d { font-weight:700; }
  .row.off .d { color:var(--muted); }
  .err { background:#fdecea; color:#a12622; border-radius:10px; padding:12px; display:none; margin-bottom:16px; }
  .tgt { position:relative; }
  .tgt::after { content:""; position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--muted); left:var(--t,100%); opacity:.7; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Time Activity</h1>
    <span class="muted" id="updated">memuat…</span>
  </header>

  <div class="err" id="err"></div>

  <div class="cards">
    <div class="card"><h2>Hari ini</h2><div class="big" id="dv"></div><div class="bar" id="db"><i></i></div><div class="muted" id="dm"></div></div>
    <div class="card"><h2>Minggu ini</h2><div class="big" id="wv"></div><div class="bar" id="wb"><i></i></div><div class="muted" id="wm"></div></div>
    <div class="card"><h2>Bulan ini</h2><div class="big" id="mv"></div><div class="bar" id="mb"><i></i></div><div class="muted" id="mm"></div></div>
  </div>

  <div class="settings">
    <label>Target harian (jam)<input type="number" id="tDay" min="0" step="0.5"></label>
    <label>Target mingguan (jam)<input type="number" id="tWeek" min="0" step="0.5"></label>
    <label>Hari kerja / minggu<input type="number" id="days" min="1" max="7" step="1"></label>
    <span class="muted">Target bulanan = target harian × hari kerja di bulan ini (Sen–Jum bila 5). Waktu dihitung saat tidak AFK.</span>
  </div>

  <div class="chart">
    <h2>Per hari — bulan ini</h2>
    <div id="days-chart"></div>
  </div>
</main>

<script>
const BUCKET_PREFIX = "aw-watcher-afk_";
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let cfg = { day: store.get("tDay", 8), week: store.get("tWeek", 40), days: store.get("days", 5) };
$("tDay").value = cfg.day; $("tWeek").value = cfg.week; $("days").value = cfg.days;
for (const [id, key, sk] of [["tDay","day","tDay"],["tWeek","week","tWeek"],["days","days","days"]]) {
  $(id).addEventListener("input", e => { cfg[key] = parseFloat(e.target.value) || 0; store.set(sk, cfg[key]); render(); });
}

const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return `${h}j ${String(m).padStart(2,"0")}m`; };
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

let perDay = {};   // dayKey -> seconds

function addEvent(ts, dur) {
  // split an event across midnights
  let t = ts, end = ts + dur * 1000;
  while (t < end) {
    const d = new Date(t), next = addDays(startOfDay(d), 1).getTime();
    const seg = Math.min(end, next) - t;
    const k = dayKey(d);
    perDay[k] = (perDay[k] || 0) + seg / 1000;
    t += seg;
  }
}

async function load() {
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const weekStart = addDays(startOfDay(now), -((now.getDay() + 6) % 7));
  const from = new Date(Math.min(monthStart, weekStart));
  const to = addDays(startOfDay(now), 1);
  try {
    const buckets = await (await fetch("/api/0/buckets/")).json();
    const ids = Object.keys(buckets).filter(b => b.startsWith(BUCKET_PREFIX));
    if (!ids.length) throw new Error("Bucket AFK tidak ditemukan.");
    const q = [`afk = flood(query_bucket(find_bucket("${BUCKET_PREFIX}")));`,
               `RETURN = filter_keyvals(afk, "status", ["not-afk"]);`];
    const res = await fetch("/api/0/query/", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: q, timeperiods: [`${from.toISOString()}/${to.toISOString()}`] })
    });
    if (!res.ok) throw new Error(await res.text());
    const events = (await res.json())[0];
    perDay = {};
    for (const e of events) addEvent(Date.parse(e.timestamp), e.duration);
    $("err").style.display = "none";
    $("updated").textContent = "diperbarui " + new Date().toLocaleTimeString("id-ID");
  } catch (e) {
    $("err").style.display = "block";
    $("err").textContent = "Gagal mengambil data: " + e.message;
  }
  render();
}

function workdaysInMonth(y, m) {
  // Mon..(Mon+days-1) count as work days
  const n = new Date(y, m + 1, 0).getDate(); let c = 0;
  for (let d = 1; d <= n; d++) { if ((new Date(y, m, d).getDay() + 6) % 7 < cfg.days) c++; }
  return c;
}

function card(prefix, secs, target, extra) {
  const pct = target ? Math.min(100, secs / target * 100) : 0;
  $(prefix + "v").innerHTML = `${fmt(secs)} <small>/ ${fmt(target)}</small>`;
  $(prefix + "b").className = "bar" + (secs >= target && target > 0 ? " done" : "");
  $(prefix + "b").firstElementChild.style.width = pct + "%";
  $(prefix + "m").textContent = `${pct.toFixed(0)}% tercapai · ` + (secs >= target ? `lebih ${fmt(secs - target)}` : `sisa ${fmt(target - secs)}`) + (extra ? " · " + extra : "");
}

function render() {
  const now = new Date(), today = startOfDay(now);
  const weekStart = addDays(today, -((now.getDay() + 6) % 7));
  const y = now.getFullYear(), m = now.getMonth();
  const sum = (a, b) => { let s = 0; for (let d = a; d < b; d = addDays(d, 1)) s += perDay[dayKey(d)] || 0; return s; };

  const dayT = cfg.day * 3600, weekT = cfg.week * 3600;
  const wd = workdaysInMonth(y, m), monthT = wd * dayT;

  card("d", perDay[dayKey(today)] || 0, dayT);
  card("w", sum(weekStart, addDays(today, 1)), weekT);
  const monthSecs = sum(new Date(y, m, 1), addDays(today, 1));
  card("m", monthSecs, monthT, `${wd} hari kerja`);

  const rows = [];
  const maxSecs = Math.max(dayT, ...Object.values(perDay), 1);
  for (let d = 1; d <= now.getDate(); d++) {
    const dt = new Date(y, m, d), s = perDay[dayKey(dt)] || 0;
    const off = (dt.getDay() + 6) % 7 >= cfg.days;
    const lbl = dt.toLocaleDateString("id-ID", { weekday: "short", day: "numeric" });
    rows.push(`<div class="row${d === now.getDate() ? " today" : ""}${off ? " off" : ""}"><span class="d">${lbl}</span>
      <div class="bar tgt${s >= dayT ? " done" : ""}" style="--t:${dayT / maxSecs * 100}%"><i style="width:${s / maxSecs * 100}%"></i></div>
      <span>${fmt(s)}</span></div>`);
  }
  $("days-chart").innerHTML = rows.reverse().join("");
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
